<svg xmlns="http://www.w3.org/2000/svg" viewBox="746 722 350 298"><style>@font-face{font-family:'Cog Data';src:url(data:font/ttf;base64,) format('truetype');}
.wall{fill:rgba(88,226,132,.05);stroke:#58e284;stroke-opacity:.7;stroke-width:1.3}
