  secondary-text-color: '#65b97f'
  disabled-text-color: '#39704a'
  text-primary-color: '#001b09'
  divider-color: '#245d37'
  outline-color: '#3c9c60'
  card-background-color: '#04140b'
  ha-card-background: '#04140b'
  ha-card-border-color: '#31824d'
  ha-card-border-width: 1px
  ha-card-border-radius: 2px
  ha-card-box-shadow: inset 0 0 16px rgba(88,226,132,.04)
