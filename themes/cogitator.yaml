cogitator:
  seasons-text: '#befacc'
  seasons-surface: '#04140b'
  primary-color: '#58e284'
  accent-color: '#58e284'
  rgb-primary-color: 88, 226, 132
  rgb-accent-color: 88, 226, 132
  primary-background-color: '#000a04'
  secondary-background-color: '#062010'
  primary-text-color: '#befacc'
