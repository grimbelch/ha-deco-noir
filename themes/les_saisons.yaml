# Les Saisons: optional Art Nouveau palette and card treatment.
les_saisons:
  seasons-text: '#49311f'
  seasons-surface: '#fbefd9'
  primary-color: '#99553b'
  accent-color: '#99553b'
  rgb-primary-color: '153, 85, 59'
  rgb-accent-color: '153, 85, 59'
  primary-background-color: '#f4e5c8'
  secondary-background-color: '#ead5b3'
  primary-text-color: '#49311f'
  rgb-primary-text-color: '73, 49, 31'
  secondary-text-color: '#72533b'
  disabled-text-color: '#8d7860'
  text-primary-color: '#fff8e9'
  divider-color: '#c6aa82'
  outline-color: '#a18057'
  card-background-color: '#fbefd9'
  ha-card-background: '#fbefd9'
  ha-card-border-color: '#b68f60'
  ha-card-border-width: '1px'
  ha-card-border-radius: '14px'
  ha-card-box-shadow: 'inset 0 0 0 3px rgba(168,126,77,.08)'
  ha-dialog-border-radius: '14px'
  mdc-theme-surface: '#fbefd9'
  app-header-background-color: '#efdebc'
  app-header-text-color: '#49311f'
  app-header-selection-bar-color: '#99553b'
  sidebar-background-color: '#f4e5c8'
  sidebar-text-color: '#49311f'
  sidebar-icon-color: '#72533b'
  sidebar-selected-text-color: '#863e2a'
  sidebar-selected-icon-color: '#863e2a'
  input-fill-color: '#ead8b9'
  input-ink-color: '#49311f'
  input-label-ink-color: '#72533b'
  input-dropdown-icon-color: '#72533b'
  switch-checked-color: '#99553b'
  switch-checked-button-color: '#fff3dc'
  switch-checked-track-color: '#aa634b'
  switch-unchecked-button-color: '#fff3dc'
  switch-unchecked-track-color: '#b6a080'
  state-active-color: '#99553b'
  state-inactive-color: '#85745b'
  state-icon-color: '#72533b'
  state-icon-active-color: '#99553b'
  state-light-on-color: '#99553b'
  state-switch-on-color: '#99553b'
  state-automation-active-color: '#99553b'
  slider-color: '#99553b'
  slider-secondary-color: '#b7a078'
  slider-track-color: '#d7be96'
  success-color: '#536b43'
  warning-color: '#8b641f'
  error-color: '#a03833'
  info-color: '#426879'
  primary-font-family: "'Trebuchet MS', Roboto, sans-serif"
  ha-font-family-body: "'Trebuchet MS', Roboto, sans-serif"
  ha-font-family-heading: "'Cormorant Garamond', Georgia, serif"
  lovelace-background: 'radial-gradient(ellipse at top, #fff3da 0%, #f4e5c8 70%) fixed'
  # Compatibility tokens keep other Home Hub tabs legible with this palette.
  deco-ink: '#f4e5c8'
  deco-midnight: '#ead5b3'
  deco-ivory: '#49311f'
  deco-gold: '#8b5b36'
  deco-gold-hi: '#633e25'
  deco-gold-rgb: '139, 91, 54'
  deco-emerald: '#536b43'
  deco-sapphire: '#426879'
  deco-garnet: '#a03833'
  deco-hair: '#b68f60'
  deco-hair-faint: '#d5bc95'
  deco-glass: '#fbefd9'
  deco-blur: '0px'
  deco-backdrop: 'none'
  deco-display: "'Cormorant Garamond', Georgia, serif"
  deco-label: "'Trebuchet MS', Roboto, sans-serif"
  deco-num: "'Trebuchet MS', Roboto, sans-serif"
  card-mod-theme: les_saisons
  card-mod-card: |
    ha-card {
      color: var(--primary-text-color);
      background: var(--ha-card-background);
      border: 1px solid var(--ha-card-border-color);
      border-radius: 14px;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    h1, h2, .card-header {
      font-family: var(--deco-display);
      color: var(--primary-text-color);
      letter-spacing: .015em;
    }
    :host(.type-custom-button-card) #name,
    :host(.type-custom-button-card) #state,
    :host(.type-custom-button-card) #meta {
      color: var(--primary-text-color) !important;
      text-shadow: none !important;
    }
